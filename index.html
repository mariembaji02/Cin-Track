<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack</title>
    <link rel="icon"  type="image/icon"  href="images/movie-icon.svg">
        <!-- link of tailwind css -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <!-- link of style sheet -->
       <link rel="stylesheet" href="style.css">
        <!-- font awsome link -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
      
</head>
<body class="min-h-screen bg-linear-to-l from-[#100f0ff7]  to-[#854b85d3] w-full">
                  <section class="modal hidden  fixed flex justify-center items-center top-0 left-0 h-full w-full z-1 bg-[rgba(33,33,33,0.31)]">
                    <div class="infos bg-red-500  w-[50%] h-[70%] rounded-lg relative">
                     
                                 
                    </div>
                  </section>
                  <div class=" min-h-screen ">

                     <nav class="flex justify-between  w-[100%] p-1">
                        <header class=" flex  items-center gap-2 p-4 rounded-lg"> <img src="images/movie-icon.svg" alt="icon" class="w-10 h-10"> <h1 class="text-xl font-semibold"> Ciné<span class="text-pink-700">Track</span></h1></header>

                            <div class="genreType flex mt-3 gap-6 h-12  w-[30%] ">
                                <button class="home cursor-pointer bg-[rgba(220,206,220,0.52)] rounded text-white border-b-5 border-white   w-[30%] text-center  text-md " data-type="all">Home</button>
                                <button class=" cursor-pointer text-white  w-[20%] text-center  text-md "  data-type="series">Serie</button>
                                <button class=" cursor-pointer text-white w-[20%] text-center  text-md "  data-type="movie">Film</button>
                                
                            </div>
                            <div class="search w-[35%]  flex mt-1 justify-center items-center gap-2 relative">
                            <input type="text" placeholder="  Enter le titre ..." class="Search border border-gray-400 rounded-md w-[100%] p-2  bg-white">
                            <i class="fa-solid fa-search text-lg  text-gray-500 absolute right-6"  ></i>
                            </div>
                           <div class=" flex  items-center gap-5 ">
                             <p  class="text-xl text-white"><i class="fa-regular fa-bell"></i></p>
                            <p class="bg-white px-2  py-3 text-center text-md rounded-lg"><i class="fa-solid fa-user "></i><span> &nbsp;Mariem Bajbouji</span></p>
                           </div>
                         </nav>
                       <main class="content  grid grid-cols-[70%_30%] ">
                       
                      <section>
                         <div class="flex flex-col justify-center items-center ">
                          <div class="CardGrid grid grid-cols-3 w-[90%] h-[40%] gap-2 px-6 py-4">
                             
                         </div>
                         <div class="pagination flex justify-around  mb-3 w-[70%]"></div>
                        
                         </div>
                          <div class="flex justify-center ">
                            <p class="message bg-[rgba(220,206,220,0.52)] text-center hidden w-[90%] rounded-md p-5 font-semibold mt-10"></p>
                          </div>
                      </section>  

                      
                             <aside class="nav  mt-4  w-[100%] ">
                        <nav class="w-[100%] h-[90%]">
                        <p class="text-md font-semibold p-3 mr-5  bg-white mb-1 rounded-lg "> Favorite <i class="fa-solid fa-heart text-red-500"></i></p>
                        
                        <ul class="FavorMovie bg-white   shadow-2xl  mr-5  rounded-lg h-[70%] p-3 ">
                        </ul>
                        </nav>
                        
                    
                   </aside>
                           

                    </main>
                   
                   

                  </div>

                    <footer class="bg-black flex flex-col justify-center items-center h-20 mt-4 " >
                      <h1 class="text-xl flex justify-center  font-semibold"> <img src="images/movie-icon.svg" alt="icon" class="w-10 h-10"> <span class="text-white"> Ciné</span><span class="text-pink-700">Track</span></h1>
                      <p class="text-white text-center text-sm">2026 CinéTrack - plateform des movies</p>
                  </footer> 



    <script type="module" src="js/main.js"></script>    
</body>
</html>
